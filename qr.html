<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR del bus · Mi Bus UAI</title>
<style>
body{font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif;color:#1c2340;margin:0;background:#f4f6fa}
.ctrl{max-width:900px;margin:0 auto;padding:16px}
.ctrl input,.ctrl select{font:inherit;padding:8px;border:1px solid #cfd5e3;border-radius:8px;width:100%;margin:4px 0 10px}
button{font:inherit;padding:10px 16px;border:0;border-radius:10px;background:#1f2d5c;color:#fff;font-weight:700;cursor:pointer}
.hoja{background:#fff;width:190mm;min-height:260mm;margin:12px auto;padding:14mm;box-sizing:border-box;text-align:center;page-break-after:always}
.hoja h1{font-size:34px;margin:0 0 6px}
.hoja .sub{font-size:20px;color:#555;margin-bottom:12mm}
.hoja .qr img,.hoja .qr canvas{width:140mm;height:140mm;image-rendering:pixelated}
.hoja .url{font:13px ui-monospace,Consolas,monospace;color:#555;margin-top:8mm;word-break:break-all}
.nota{font-size:13px;color:#6f7694}
@media print{body{background:#fff}.ctrl{display:none}.hoja{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="ctrl">
  <h2>QR del bus</h2>
  <p class="nota">Abre esta página <b>desde la dirección publicada</b> (GitHub Pages o Netlify), no desde el archivo local: el QR lleva la dirección de la app. Revisa la dirección de abajo antes de imprimir.</p>
  <label>Dirección de la app</label><input id="base">
  <button onclick="window.print()">Imprimir</button>
</div>
<div class="hoja"><h1>🚌 Bus UAI</h1><div class="sub">Escanea con la cámara del iPhone al subir: el check-in va al próximo bus de tu paradero</div><div class="qr" id="qr1"></div><div class="url" id="u1"></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var base=document.getElementById("base"),BUS="DEMO";   // código fijo: es el mismo QR que ya imprimieron
base.value=location.protocol==="file:"?"https://juanramonllao.github.io/mi-bus-uai/app.html":location.href.replace(/qr\.html.*$/,"app.html");
function qr(el,txt){var q=qrcode(0,"M");q.addData(txt);q.make();document.getElementById(el).innerHTML=q.createImgTag(10,8)}
function pintar(){var b=base.value.trim(),u=b+(b.indexOf("?")>=0?"&":"?")+"checkin="+BUS;
  qr("qr1",u);document.getElementById("u1").textContent=u}
base.oninput=pintar;pintar();
</script>
</body>
</html>
